name: Bug report
description: Something in Atlas doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, email ismael@insanearts.io instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. atlas open --app TextEdit
        2. atlas type "hello"
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The full JSON reply, and any error printed on standard error.
      render: json
  - type: textarea
    id: doctor
    attributes:
      label: atlas doctor --verbose
      description: Remove anything private before pasting.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Atlas version
      placeholder: atlas --version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1, Apple silicon
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Another agent
        - No agent (CLI or app directly)
