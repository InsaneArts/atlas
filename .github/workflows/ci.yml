name: Check
# A branch is checked through its pull request, merged with main, and main on
# each push: checking a branch's pushes as well ran every change twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check unused Rust dependencies
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo machete --skip-target-dir .
      - name: Compile the native fixture (desktop qualification is manual)
        run: swiftc tests/live/DesktopFixture.swift -o /tmp/AtlasFixture -framework AppKit -framework CoreGraphics
      # The limits stop a hang well before the runner gives out, which it has
      # done about 46 minutes in, losing the log; these steps take about 3 and
      # at most 21 minutes.
      - name: Build the menu bar package
        run: swift build -c release --package-path app
        timeout-minutes: 15
      - name: Rust, Node and Swift checks
        run: scripts/check.sh
        timeout-minutes: 35
  minimum-compiler:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88.0 check --workspace --all-targets --locked
