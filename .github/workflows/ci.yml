name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check unused Rust dependencies
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo machete --skip-target-dir .
      - name: Compile the native fixture (desktop qualification is manual)
        run: swiftc tests/live/DesktopFixture.swift -o /tmp/AtlasFixture -framework AppKit -framework CoreGraphics
      - name: Build the menu bar package
        run: swift build -c release --package-path app
      - name: Rust, Node and Swift checks
        run: scripts/check.sh
        timeout-minutes: 60
  minimum-compiler:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88.0 check --workspace --all-targets --locked
