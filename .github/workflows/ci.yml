name: Check
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers
      - name: Probe
        env:
          PROBE_DIR: ${{ runner.temp }}/probe
        run: swift test --package-path app --filter ProbeMotionTests 2>&1 | grep -E "SCROLL|PROBE|✘|✔|error:" || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: ${{ runner.temp }}/probe
