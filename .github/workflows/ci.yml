name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Compile the native fixture (desktop qualification is manual)
        run: swiftc tests/live/DesktopFixture.swift -o /tmp/UnderstudyFixture -framework AppKit -framework CoreGraphics
      - name: Compile the menu bar companion
        run: swiftc -O -framework AppKit menubar/UnderstudyBar.swift -o /tmp/UnderstudyBar
