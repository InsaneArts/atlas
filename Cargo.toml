[package]
name = "understudy"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Observe and control a prepared background macOS desktop"
repository = "https://github.com/InsaneArts/understudy"

[lib]
path = "src/lib/lib.rs"

[[bin]]
name = "understudy"
path = "src/bin/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
unicode-segmentation = "1.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
