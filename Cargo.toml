[package]
name = "atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
autobins = false
description = "Observe and control a prepared background macOS desktop"
repository = "https://github.com/InsaneArts/atlas"

[lib]
path = "src/lib/lib.rs"

[[bin]]
name = "atlas"
path = "src/bin/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
fs2 = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indicatif = "0.18"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "process", "signal", "term", "user"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSURL"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXError", "AXUIElement", "AXValue", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGSession", "CGWindow"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "AuthSession"] }

[lints]
workspace = true

[workspace]
members = ["xtask"]
default-members = [".", "xtask"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
