[package]
name = "understudy"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Observe and control a prepared background macOS desktop"
repository = "https://github.com/InsaneArts/understudy"

[lib]
path = "src/lib/lib.rs"

[[bin]]
name = "understudy"
path = "src/bin/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
unicode-segmentation = "1.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXError", "AXUIElement", "AXValue", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGImage", "CGSession", "CGWindow"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "AuthSession"] }
