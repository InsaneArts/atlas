[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/native",
    "crates/daemon",
    "crates/control",
    "crates/client",
    "crates/agents",
    "crates/cli",
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/InsaneArts/atlas"

[workspace.dependencies]
atlas-agents = { path = "crates/agents" }
atlas-cli = { path = "crates/cli" }
atlas-client = { path = "crates/client" }
atlas-control = { path = "crates/control" }
atlas-core = { path = "crates/core" }
atlas-daemon = { path = "crates/daemon" }
atlas-native = { path = "crates/native" }

axum = { version = "0.8", default-features = false }
base64 = "0.22"
block2 = "0.6"
clap = "4.6"
console = "0.16"
crossterm = { version = "0.29", default-features = false }
dialoguer = { version = "0.12", default-features = false }
dispatch2 = "0.3"
flate2 = { version = "1", default-features = false }
fs2 = "0.4"
hyper = "1"
hyper-util = "0.1"
image = { version = "0.25", default-features = false }
indicatif = { version = "0.18", default-features = false }
libc = "0.2"
memmap2 = "0.9"
nix = "0.31"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-application-services = { version = "0.3.2", default-features = false }
objc2-core-audio = { version = "0.3.2", default-features = false }
objc2-core-audio-types = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-image-io = { version = "0.3.2", default-features = false }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false }
objc2-security = { version = "0.3.2", default-features = false }
oslog = { version = "0.2", default-features = false }
psl = "2"
rand = { version = "0.9", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = "1"
toml = "1.1"
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
let_underscore_future = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_dependencies = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
