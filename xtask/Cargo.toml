[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
sha2 = "0.10"
atlas = { path = ".." }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
