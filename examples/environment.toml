# Environment manifest: an explicit one-way snapshot into the helper home.
#
#   atlas environment examples/environment.toml          # preview
#   atlas environment examples/environment.toml --apply  # apply
#
# source: absolute, or relative to this file. target: ASCII path inside the
# helper home. Stop applications that write these files before applying.

[[files]]
source = "/absolute/path/to/tool"
target = ".local/bin/tool"
executable = true

[[files]]
source = "/absolute/path/to/tool-settings.toml"
target = ".config/tool-settings.toml"
