[package]
name = "atlas-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The macOS calls Atlas makes inside the helper login"
license.workspace = true
repository.workspace = true

[features]
# Helpers and hooks for the tests of crates above; never in a shipped build.
test-support = []

[dependencies]
atlas-core.workspace = true
fs2.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["process", "signal", "user"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
unicode-segmentation.workspace = true

[dev-dependencies]
atlas-core = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
nix = { workspace = true, features = ["fs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSImage", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-application-services = { workspace = true, features = ["std", "HIServices", "AXError", "AXUIElement", "AXValue", "libc"] }
objc2-core-audio = { workspace = true, features = ["std", "AudioHardware", "block2", "dispatch2", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { workspace = true, features = ["std", "block2", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFError", "CFNotificationCenter", "CFNumber", "CFRunLoop", "CFString", "CFURL"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGSession", "CGWindow"] }
objc2-core-media = { workspace = true, features = ["std", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["std", "CVBase", "CVBuffer", "CVPixelBuffer", "CVImageBuffer", "CVReturn"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSObject", "NSString", "NSUUID", "NSValue"] }
objc2-image-io = { workspace = true, features = ["std", "CGImageDestination", "CGImageSource", "objc2-core-graphics"] }
objc2-screen-capture-kit = { workspace = true, features = ["std", "SCStream", "SCShareableContent", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-security = { workspace = true, features = ["std", "AuthSession", "Authorization"] }

[lints]
workspace = true
