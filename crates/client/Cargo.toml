[package]
name = "atlas-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The controller side of Atlas: verified requests and the work built on them"
license.workspace = true
repository.workspace = true

[features]
# Helpers and hooks for the tests of crates above; never in a shipped build.
test-support = ["atlas-control/test-support", "atlas-core/test-support", "nix/event", "nix/socket"]

[dependencies]
atlas-control.workspace = true
atlas-core.workspace = true
atlas-daemon.workspace = true
atlas-native.workspace = true
base64.workspace = true
fs2.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["dir", "fs", "process", "signal", "user"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
unicode-segmentation.workspace = true

[dev-dependencies]
atlas-control = { workspace = true, features = ["test-support"] }
atlas-core = { workspace = true, features = ["test-support"] }
atlas-daemon = { workspace = true, features = ["test-support"] }
atlas-native = { workspace = true, features = ["test-support"] }
nix = { workspace = true, features = ["event", "socket"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
