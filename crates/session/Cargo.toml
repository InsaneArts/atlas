[package]
name = "atlas-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authenticated, encrypted connections between a station and its desktops"
license.workspace = true
repository.workspace = true

[features]
# Helpers and hooks for the tests of crates above; never in a shipped build.
test-support = ["atlas-core/test-support"]

[dependencies]
atlas-core.workspace = true
snow = { workspace = true, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
atlas-core = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
