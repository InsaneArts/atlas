[package]
name = "atlas-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The daemon Atlas runs inside the helper login and its setup there"
license.workspace = true
repository.workspace = true

[features]
# Helpers and hooks for the tests of crates above; never in a shipped build.
test-support = []

[dependencies]
atlas-core.workspace = true
atlas-native.workspace = true
base64.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal", "user"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
atlas-core = { workspace = true, features = ["test-support"] }
atlas-native = { workspace = true, features = ["test-support"] }
nix = { workspace = true, features = ["socket"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-application-services = { workspace = true, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGDirectDisplay", "CGEvent", "CGRemoteOperation"] }
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSUserDefaults"] }

[lints]
workspace = true
