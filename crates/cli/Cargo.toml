[package]
name = "atlas-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Observe and control a prepared background macOS desktop"
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "atlas"
path = "src/bin/atlas/main.rs"

[dependencies]
atlas-agents.workspace = true
atlas-client.workspace = true
atlas-control.workspace = true
atlas-core.workspace = true
atlas-daemon.workspace = true
atlas-native.workspace = true
axum.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
console.workspace = true
crossterm = { workspace = true, features = ["events"] }
dialoguer.workspace = true
flate2 = { workspace = true, features = ["rust_backend"] }
fs2.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
image = { workspace = true, features = ["png"] }
indicatif = { workspace = true, features = ["unicode-width"] }
libc.workspace = true
nix = { workspace = true, features = ["poll", "process", "signal", "term", "user"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "tokio"] }
atlas-agents = { workspace = true, features = ["test-support"] }
atlas-client = { workspace = true, features = ["test-support"] }
atlas-control = { workspace = true, features = ["test-support"] }
atlas-core = { workspace = true, features = ["test-support"] }
atlas-daemon = { workspace = true, features = ["test-support"] }
atlas-native = { workspace = true, features = ["test-support"] }
nix = { workspace = true, features = ["fs", "poll"] }
proc-macro2.workspace = true
quote.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
syn.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
