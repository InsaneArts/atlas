[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "understudy-desktop"
version = "0.1.0"
description = "A measured prototype for agent control of a background macOS login session"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
understudy = "understudy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
